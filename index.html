<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Safana | ServiceNow Developer</title>
<meta name="description" content="Portfolio of Safana: ServiceNow CSA, former Infosys software engineer, Society360 capstone winner.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--soft:#f4f4f5;--line:#e4e4e7;--mid:#a1a1aa;--text:#3f3f46;--ink:#18181b;--max:1080px}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);line-height:1.65;font-size:17px}
a{color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.wrap{max-width:var(--max);margin:0 auto;padding:0 24px}
header{border-bottom:1px solid var(--line);position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(6px);z-index:5}
nav{display:flex;justify-content:space-between;align-items:center;height:64px}
nav .logo{font-weight:800;font-size:1.25rem;color:var(--ink);text-decoration:none}
nav ul{display:flex;gap:22px;list-style:none;padding:0;font-size:.95rem}
nav ul a{text-decoration:none}
nav ul a:hover{color:var(--ink);text-decoration:underline}
/* carousel */
.journey{padding:48px 0 32px}
.journey h1{font-size:clamp(2.2rem,6vw,4rem);line-height:1.05;color:var(--ink);font-weight:800;letter-spacing:-.02em;max-width:14ch}
.journey .sub{margin:14px 0 28px;max-width:52ch}
.car{border:1px solid var(--line);border-radius:6px;overflow:hidden}
.stage{display:grid;grid-template-columns:1.1fr 1fr;background:var(--soft);min-height:380px}
.art{background:#fff;border-right:1px solid var(--line);display:flex;align-items:center;justify-content:center;padding:24px}
.art svg{width:100%;max-width:380px;height:auto}
.txt{padding:36px;display:flex;flex-direction:column;justify-content:center}
.txt small{color:var(--mid);font-size:.9rem}
.txt h2{color:var(--ink);font-size:1.7rem;line-height:1.2;margin:6px 0 12px;font-weight:600}
.txt .fact{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);font-size:.92rem;color:var(--mid)}
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 18px;border-top:1px solid var(--line);background:#fff}
.dots{display:flex;gap:8px;flex-wrap:wrap}
.dots button{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:99px;font:inherit;font-size:.85rem;cursor:pointer;color:var(--text)}
.dots button:hover{background:var(--soft)}
.dots button[aria-current=true]{background:var(--ink);color:#fff;border-color:var(--ink)}
.right{display:flex;align-items:center;gap:14px}
.count{color:var(--mid);font-size:.9rem;min-width:3.2em;text-align:right}
.arrows{display:flex;gap:8px}
.arrows button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:1.1rem;cursor:pointer}
.arrows button:hover{background:var(--soft)}
.explor
